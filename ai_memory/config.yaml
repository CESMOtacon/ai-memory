name: AI Memory
version: "0.2.0"
slug: ai_memory
description: Persistent memory, open loops and a searchable notebook for your LLM voice assistant
url: https://github.com/CESMOtacon/ai-memory
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
services:
  - mqtt:need
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:notebook-outline
panel_title: AI Memory
map:
  - addon_config:rw
options:
  assistant_name: Assistant
  user_name: the user
  summarizer_backend: ai_task
  ai_task_entity: ""
  anthropic_api_key: ""
  anthropic_model: claude-opus-5
  day_boundary_hour: 5
  forget_grace_days: 7
  timezone: ""
  log_level: info
schema:
  assistant_name: str
  user_name: str
  summarizer_backend: list(ai_task|anthropic|off)
  ai_task_entity: str?
  anthropic_api_key: password?
  anthropic_model: str
  day_boundary_hour: int(0,23)
  forget_grace_days: int(0,365)
  timezone: str?
  log_level: list(debug|info|warning|error)
